<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <title>Frontend Mentor | QR code component</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background-color: #d5e1ef;
        width: 100vw;
        min-height: 100vh;
      }
      .attribution {
        position: absolute;
        bottom: 10px;
        font-size: 0.6875rem;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
      .text-preset-1 {
        font-family: "Outfit", sans-serif;
        font-weight: bold;
        font-size: 22px;
      }
      .text-preset-2 {
        font-family: "Outfit", sans-serif;
        font-size: 15px;
      }

      .qr-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 16px 16px;
        padding-bottom: 40px;
        border-radius: 20px;
        background-color: white;
      }
      .qr-container img {
        width: 288px;
        height: 288px;
        border-radius: 10px;
        margin-bottom: 24px;
      }
      .qr-container h1 {
        margin: 0;
        padding: 0;
        text-align: center;
        color: #1f314f;
        max-width: 256px;
      }
      .qr-container p {
        margin: 0;
        padding: 0;
        text-align: center;
        color: #68778d;
        max-width: 256px;
      }
      .qr-text-container {
        padding-left: 16px;
        padding-right: 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        max-width: 288px;
      }
    </style>
  </head>
  <body>
    <div class="qr-container">
      <img src="images/image-qr-code.png" alt="QR" />
      <div class="qr-text-container">
        <h1 class="text-preset-1">
          Improve your front-end skills by building projects
        </h1>
        <p class="text-preset-2">
          Scan the QR code to visit Frontend Mentor and take your coding skills
          to the next level
        </p>
      </div>
    </div>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Your Name Here</a>.
    </footer>
  </body>
</html>
